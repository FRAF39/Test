
name: Extract ZIP Files

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract ZIP Files
        run: |
          python - <<'PY'
          import zipfile
          import os
          import shutil
          import tempfile
          from pathlib import Path

          root = Path.cwd()

          for zip_path in list(root.rglob("*.zip")):
              if ".git" in zip_path.parts:
                  continue

              print(f"Extracting: {zip_path}")

              with tempfile.TemporaryDirectory() as temp:
                  temp = Path(temp)

                  with zipfile.ZipFile(zip_path) as z:
                      for item in z.infolist():
                          target = (temp / item.filename).resolve()
                          if not target.is_relative_to(temp.resolve()):
                              raise ValueError("Unsafe ZIP path detected")
                      z.extractall(temp)

                  items = list(temp.iterdir())

                  if len(items) == 1 and items[0].is_dir():
                      source = items[0]
                  else:
                      source = temp

                  for item in source.iterdir():
                      destination = root / item.name

                      if item.is_dir():
                          shutil.copytree(
                              item, destination, dirs_exist_ok=True
                          )
                      else:
                          shutil.copy2(item, destination)

              zip_path.unlink()
              print(f"Deleted: {zip_path}")

          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto extract ZIP files"
          git push
          
